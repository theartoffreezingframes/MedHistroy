<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CareVault — Provider</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23073036'/%3E%3Cpath d='M16 7l7 3v6c0 4.6-3 7.9-7 9-4-1.1-7-4.4-7-9v-6l7-3z' fill='none' stroke='%2312b091' stroke-width='2.2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/app.css">
<style>
  .big-action{padding:2.2rem;border-radius:var(--radius-lg);text-align:center;cursor:pointer;transition:.2s}
  .big-action:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
  .big-action .em{width:72px;height:72px;margin:0 auto 1rem;border-radius:22px;display:grid;place-items:center;font-size:2rem}
</style>
</head>
<body class="app-body">
<div class="shell">
  <div class="side-backdrop" id="sideBackdrop"></div>
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#/home">
      <span class="brand-mark"><svg width="20" height="20" viewBox="0 0 32 32" fill="none"><path d="M16 4l9 4v7c0 6-3.9 10.2-9 11.6C10.9 25.2 7 21 7 15V8l9-4z" stroke="#fff" stroke-width="2.4"/><path d="M11.5 16.2h2.4l1.3-3 2.2 5.6 1.4-2.6h2" stroke="#ffb45c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      CareVault <span class="badge info" style="margin-left:.3rem">Provider</span>
    </a>
    <div class="side-section">Clinic</div>
    <nav class="side-nav" id="sideNav"></nav>
    <div class="sidebar-foot">
      <div class="small muted mb-1" id="orgFoot"></div>
      <button class="side-link" id="logoutBtn"></button>
    </div>
  </aside>

  <div class="main-col">
    <div class="topbar">
      <button class="icon-btn" id="hamburger" aria-label="Open menu">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
      <div style="flex:1"><b id="pageTitle"></b></div>
      <span id="netHolder"></span>
      <button class="icon-btn" id="bellBtn" aria-label="Notifications"><span id="bellHolder"></span></button>
      <div class="user-chip"><span class="avatar" id="userAvatar">…</span><span id="userName" style="font-weight:650;font-size:.92rem"></span></div>
    </div>
    <main class="content" id="view" tabindex="-1"></main>
  </div>
</div>
<div class="toast-wrap"></div>
<script src="/js/ui.js"></script>
<script src="/js/provider.js"></script>
</body>
</html>
